name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest is Ubuntu 26 (kernel 6.19+), where MongoDB 8.0 refuses to start
    # ("Linux kernel versions 6.19 and newer has a known incompatibility", run 43046883544).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic, non-secret values so builds validate configuration.
      API_INTERNAL_ORIGIN: http://127.0.0.1:4100
      PUBLIC_ORIGIN: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Account, session and transaction tests need a real replica set (a standalone server is not enough).
      - name: Start MongoDB 8.0 single-node replica set
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            if out=$(docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }; quit(db.hello().isWritablePrimary ? 0 : 1)" 2>&1); then
              echo "MongoDB is PRIMARY after $i attempts"
              exit 0
            fi
            sleep 2
          done
          # Fail here (not later in the tests) and leave the reason in the run's annotations.
          state=$(docker ps -a --filter name=mongo --format '{{.Status}}')
          logs=$(docker logs mongo 2>&1 | tail -n 15 | cut -c1-240 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=MongoDB did not become PRIMARY::container: ${state}%0Alast check: ${out:0:300}%0A${logs}"
          exit 1
      - run: npm run test:integration
      - run: npm run build
